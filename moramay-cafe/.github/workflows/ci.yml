name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moramay-cafe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: moramay-cafe/package-lock.json

      - name: Install dependencies
        run: npm install --workspace=apps/api

      - name: Lint
        run: npm run lint --workspace=apps/api

      - name: Test
        run: npm run test --workspace=apps/api

      - name: Build
        run: npm run build --workspace=apps/api
